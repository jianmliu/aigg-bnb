[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.33"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "write", path = "../deployments" }, { access = "read", path = "../flybnb/genesis" }]
# the neutral contracts and forge-std are git submodules under lib/ (pinned; see .gitmodules)
remappings = [
  "forge-std/=lib/forge-std/src/",
  "aigg-porw/=lib/aigg-porw/contracts/evm/src/",
]
