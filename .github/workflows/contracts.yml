# Compiles the contracts and runs the tests that need no chain, on every pull request and on main.
#
# It runs on `pull_request`, not on branch pushes, and the difference is the point: a pull_request run checks
# out the merge of the branch into main, so it tests what main will be rather than what the branch is. Two
# branches that are each green can still merge into something that does not compile -- one added a tenth field
# to `Individual` while the other was destructuring nine -- and git will merge that without a conflict.
#
# The anvil and Playwright end-to-end tests are deliberately not run here.
name: contracts

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      # aigg-porw and forge-std are submodules under contracts/lib, and aigg-porw carries a forge-std of its own
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge test
        working-directory: contracts

  js:
    runs-on: ubuntu-latest
    steps:
      # the memory test imports mem.js out of the aigg-porw submodule, so this job needs it too
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node test/env_mapping.mjs
      # the gateway's registration with ai.gg, against a stand-in for its admin API: no chain, no network
      - run: node test/aigg_src_sync.mjs

      # render.yaml is edited next to a key file: no secret has a value, and the brains it names are known ones
      - run: node test/render_blueprint.mjs

      # the fee rate is stated in three documents and charged in one place: they must be the same number
      - run: node test/fee_rate_units.mjs

      # the read quota is what runs out first, and what nobody can see: the arithmetic of it is checked
      - run: node test/greenfield_quota.mjs

      # Preserve upstream address and content-addressed runtime checks.
      - run: node test/brain_addresses.mjs
      - run: node test/runtime_id.mjs

      # the agent skill tells an agent what to run against a real chain: every path, route, field and price in it
      # is held against the code it describes, because an agent follows a stale instruction without checking
      - run: node test/skill_flybnb.mjs

      # "not funded" is a claim about one fly; on a deployment with no queue it was being made about all of them
      - run: node test/battery_queue_panel.mjs

      # DESIGN §4b distinguishes optional multi-asset contracts from the legacy native gateway
      - run: node test/settlement_assets.mjs

      # the genesis set is committed to once, at deployment: the published file is what the generator writes and every proof opens
      - run: node test/genesis_set.mjs
      - run: node --test test/genesis_v2.mjs test/breed_recipe.mjs
      - run: node flybnb/genesis/build_genesis_v2.mjs --check
      # where each measured individual stands among the founders, and that the published files still match the runs
      - run: node test/phenotypes.mjs

      - run: node test/frontend_wallet.mjs
      - run: node test/frontend_memory.mjs

      # chain-free: the FlyBnB battery file is well formed and its batch form is order-preserving; the paper build never touches prose
      - run: node test/flybnb_battery.mjs

      - run: node test/flybnb_build.mjs
