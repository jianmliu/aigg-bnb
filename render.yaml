# The relayer on Render, as a Blueprint: what the service is, and every setting of it that is not a secret.
#
# Why this file exists. The contract addresses the relayer serves used to live only in the Render dashboard. On
# 2026-09-18 the testnet moved to scheme v3 and ten values had to be retyped there by hand, with nothing to review and
# nothing to diff. Here they are a commit: a redeployment of the contracts is a pull request that changes this block.
# (The Render CLI cannot do it either -- `render services update` has no flag for environment variables.)
#
# What is deliberately NOT here:
#   - PORW_RELAYER_KEY, and PORW_RPC (a provider URL may carry an API key). Both are `sync: false`: Render asks for
#     them once, when the Blueprint is first created, and ignores them on every later sync. They stay in the dashboard.
#   - the sponsorship budgets and the beacon's wake window (PORW_SPONSOR_EPOCH_GAS, PORW_SPONSOR_DAY_GAS,
#     PORW_BEACON_WAKE_EPOCHS). A key listed here OVERWRITES the dashboard's value on every sync, and a key that is not
#     listed is left alone. These are an operator's knobs, so they are left alone; unset, the code's defaults apply.
#
# The service block mirrors the live service exactly (read with `render services -o json`, 2026-09-18): plan, region,
# commands, health check, auto-deploy OFF. Render's own warning is the reason: an option omitted from a Blueprint falls
# back to a default that "almost definitely differs" from what a hand-made service has.
#
# ADOPTING THE EXISTING SERVICE -- read before the first sync. A new Blueprint whose service name matches one already
# in the workspace does not take that service over: Render creates a second one with a suffixed name. To put the
# running service under this file, add it to the Blueprint from the dashboard (or use Generate Blueprint on it and
# compare with this file); if the first sync offers to CREATE a web service, stop. Removing a service from this file
# never deletes it.
services:
  - type: web
    name: aigg-bnb-relayer-testnet
    runtime: node
    # Never `free`: a free instance sleeps when idle, a sleeping relayer misses its beacon commit and reveal, and with
    # one committer the epoch then never rolls -- the whole mesh stalls (docs/DEPLOY-MAINNET.md, "Host: Render").
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    branch: main
    # Deploys are manual, on purpose. A restart drops the beacon secret the relayer committed for the next epoch, so
    # that epoch gets no reveal from it; a deploy is something to time, not something every merge should cause.
    # (`checksPass` is the alternative once that is solved: it waits for the `contracts` workflow on main.)
    autoDeployTrigger: "off"
    # aigg-porw is a submodule and the relayer imports its runtime out of it (contracts/lib/aigg-porw/web/porw-browser)
    buildCommand: git submodule update --init --recursive && npm ci
    startCommand: npm run relayer
    healthCheckPath: /status
    previews:
      generation: off
    envVars:
      # `process.loadEnvFile` and the rest need Node 22; Render's default moves with the date a service was created
      - key: NODE_VERSION
        value: 22.12.0

      # ---- hosting: one port for the API and the relay hub, and the address browsers are told ----
      - key: PORW_HOST
        value: 0.0.0.0
      - key: PORW_RELAY_PATH
        value: /relay
      - key: PORW_PUBLIC_RELAY_URL
        value: wss://aigg-bnb-relayer-testnet.onrender.com/relay

      # ---- the deployment: BSC testnet, scheme v3, deployed 2026-09-19 from main at b3a88d7 (aigg-porw 994ccf4) ----
      - key: PORW_NETWORK
        value: bsc-testnet
      - key: PORW_CHAIN_ID
        value: "97"
      - key: PORW_EPOCH_BLOCKS
        value: "200"
      - key: PORW_VERIFIER
        value: "0xcE023ee73A1Ab3A8Ca481B4EA540E48AE24F3365"
      - key: PORW_MEP_REGISTRY
        value: "0xC779151b405513B48787B8F1111f79FAC10CDb7A"
      - key: PORW_INSTANCES
        value: "0x50b015f2a2a04E2D177343bE4bDB652AFf8100B1"
      - key: PORW_BEACON
        value: "0x3F4AB29555b696BACbB2450188ad640013941484"
      - key: PORW_CLAIMS
        value: "0x2E9da33606a21e31DDceD22d960b906bAc199c1F"
      - key: PORW_MARKET
        value: "0x71120BcF8EFDcc6E4c0299e035676dB6d0d68F19"
      - key: PORW_DISPUTES
        value: "0xeEC51cFaB44B45dEc8d34941F75044C5230841de"
      - key: PORW_RELAYS
        value: "0x50Cd9B2A00b4B8B33a130C879E7095A9Da7f29Ce"
      - key: PORW_CLAIM_VALIDITY_EPOCHS
        value: "6"

      # ---- the brains it serves. What it serves FOLLOWS THE WHITELIST: for every collection the curator has listed,
      # the base brains it names and every brain bound to one of its flies, bred ones included, with nothing restarted.
      # The genesis collection's base is the >= 2-synapse export (0x79af…: the base its hundred founders are variants
      # of), so that one is not pinned here; it arrives through the list.
      - key: PORW_WHITELIST
        value: "0xAd8e7206A9bE4F24Ce0aa2c861F1E9331A16681C"
      # PINNED on top of the list: the >= 5-synapse export the gate task and test/live_bsc.mjs run on, and the MALE base
      # (MaleCNS v1.0, >= 2 synapses). Both belong to no collection, so without this line nobody would serve them.
      # The male one is the first brain here that is NOT int-lif at FlyWire's weight unit: its exec kind pins 7209
      # (0.40 of 18022, because MaleCNS counts the same connections 1.55-1.62x higher and at 18022 every male stimulus
      # ignites the whole network). The relayer asks the chain for a kind's unit, so nothing here has to say it twice.
      - key: PORW_MEP_IDS
        value: "0x312dda12d308ba13796472e6ba444be4a94a5b04ce9e5ef3ada3649034443f8a,0xc17357517fa10c848713812c75543a7e74978bb1f4554dab75bcf7315022d214"
      - key: PORW_MEP_NAMES
        value: "0x312dda12d308ba13796472e6ba444be4a94a5b04ce9e5ef3ada3649034443f8a=FlyWire female (FAFB v783),0x79af9764440ecfefecac3056fccfa3720c1cbb09600eb0d2facad53da4315f50=FlyWire female · the founders' base (≥ 2 synapses),0xc17357517fa10c848713812c75543a7e74978bb1f4554dab75bcf7315022d214=MaleCNS v1.0 male · brain and nerve cord (≥ 2 synapses)"

      # ---- whose tasks are sponsored. Third-party experiments are not open yet: every task on this network is one the
      # FlyBnB dataset needs, posted by the project. The market is permissionless and cannot refuse anybody's task; what
      # is withheld is this relayer's gas (a session key holds none of its own), and the page reads this list from
      # /deployment and shows "not open yet" instead of a booking card. Remove the key to open the network.
      # The second address is the gateway's fee wallet (the service below): experiments reach the network through ai.gg,
      # and the gateway is the one client that posts them. Without it here, its tasks' results are never sponsored.
      - key: PORW_TASK_CLIENTS
        value: "0xFE560Af8f5cFC209794b3Df7DC7E281D4Ef81EDa,0xf5Cfcb350268aEC30e8d814E48DaB01CBE54B5A7"

      # ---- the beacon follows demand: a cold epoch never rolls and costs nothing ----
      - key: PORW_BEACON_LAZY
        value: "1"

      # ---- genesis v2 treasury inventory, 2026-09-20: 100 female + 100 male Founders.
      # Protected zero-cost pre-mint into FounderInventoryVault; public Adopt is resale at 0.01 tBNB.
      # Full BNB proceeds go to the existing TreasuryRouter (0x1Bef7990…3708); no adopter Host bond.
      # Breed fee 0.005, hatch bounty 0.0001 tBNB; royalty 1000 bps; base share 1000 bps; resale 500 bps.
      # Legacy collection/NFTs remain intact. Battery budget/worker require separate deployment.
      - key: PORW_COLLECTION
        value: "0xb42dfb7b281535ddc836b3de8df62e5f59b5b7c5"
      - key: PORW_INVENTORY_SALE
        value: "0x9668397498C564DB5e604b1156EEE97Ed6A62f62"

      # ---- secrets: asked for once, never synced, never in git ----
      - key: PORW_RELAYER_KEY
        sync: false
      - key: PORW_RPC
        sync: false

  # The gateway (gateway/gateway.mjs, docs/GATEWAY.md): an OpenAI-compatible API in front of the mesh, registered with ai.gg
  # as an upstream account (npm run gateway:aigg). It is its own service because it holds money -- every call's fee is paid
  # from GATEWAY_KEY's wallet -- and the relayer's key never should. Created 2026-09-19 with `render services create` as
  # srv-danacg942hec73dqnsig (https://aigg-bnb-gateway-testnet.onrender.com); the disk and the three secrets are added in
  # the dashboard (the CLI does neither).
  - type: web
    name: aigg-bnb-gateway-testnet
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    branch: main
    # manual, like the relayer's: a deploy restarts the gateway, and a call between postTask and settle is picked up again
    # from the disk -- but only if it is there, which is what the disk is for
    autoDeployTrigger: "off"
    buildCommand: git submodule update --init --recursive && npm ci
    startCommand: npm run gateway
    healthCheckPath: /healthz
    previews:
      generation: off
    # The calls, on disk. A fee is spent at postTask, so a call has to survive a restart until it settles: the gateway writes
    # it here BEFORE a wei moves, and on start drives every posted, unsettled call on. Without a disk a redeploy forgets them.
    disk:
      name: gateway-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: GATEWAY_HOST
        value: 0.0.0.0
      - key: GATEWAY_STATE
        value: /var/data/gateway-state.json
      # the relayer: /meps, and the relay the gateway announces tasks on. Its /deployment must agree with the PORW_*
      # below on the market, or the gateway refuses to start -- money is not sent where an HTTP endpoint says
      - key: GATEWAY_RELAYER
        value: https://aigg-bnb-relayer-testnet.onrender.com

      # ---- the deployment: the same as the relayer's, above ----
      - key: PORW_NETWORK
        value: bsc-testnet
      - key: PORW_CHAIN_ID
        value: "97"
      - key: PORW_EPOCH_BLOCKS
        value: "200"
      - key: PORW_VERIFIER
        value: "0xcE023ee73A1Ab3A8Ca481B4EA540E48AE24F3365"
      - key: PORW_MEP_REGISTRY
        value: "0xC779151b405513B48787B8F1111f79FAC10CDb7A"
      - key: PORW_INSTANCES
        value: "0x50b015f2a2a04E2D177343bE4bDB652AFf8100B1"
      - key: PORW_BEACON
        value: "0x3F4AB29555b696BACbB2450188ad640013941484"
      - key: PORW_CLAIMS
        value: "0x2E9da33606a21e31DDceD22d960b906bAc199c1F"
      - key: PORW_MARKET
        value: "0x71120BcF8EFDcc6E4c0299e035676dB6d0d68F19"
      - key: PORW_DISPUTES
        value: "0xeEC51cFaB44B45dEc8d34941F75044C5230841de"
      - key: PORW_RELAYS
        value: "0x50Cd9B2A00b4B8B33a130C879E7095A9Da7f29Ce"

      # ---- what it offers ----
      # the names callers use; `mep:0x…` works for any served brain, and a registered fly is `fly-<token>`
      - key: GATEWAY_MODELS
        value: "flywire-783-min5=0x312dda12d308ba13796472e6ba444be4a94a5b04ce9e5ef3ada3649034443f8a,flywire-783-min2=0x79af9764440ecfefecac3056fccfa3720c1cbb09600eb0d2facad53da4315f50"
      # named stimulus sets (`input.stimulate.set`): the gate task's two, payload indices of the FlyWire export
      - key: GATEWAY_SETS
        value: tasks/flywire-gate/stimulus_sets.json
      # two providers who do not know each other, or no call (503 model_cold)
      - key: GATEWAY_MIN_REDUNDANCY
        value: "2"
      # 100 gwei (10^-7 BNB) per step per provider: 100 steps at redundancy 2 is 0.00002 tBNB.
      # NOT the 0.1 gwei that turns up elsewhere -- that is the measured GAS price, a different quantity.
      - key: GATEWAY_WEI_PER_STEP
        value: "100000000000"
      # a host's page loads a brain with room for 100 steps unless its owner asks for more; a longer task would find no
      # provider able to run it and be refunded only after the market's timeout. Raise it with the hosts.
      - key: GATEWAY_DEFAULT_STEPS
        value: "100"
      - key: GATEWAY_MAX_STEPS
        value: "100"

      # ---- secrets: never synced, never in git ----
      # GATEWAY_KEY: the fee wallet, 0xf5Cfcb350268aEC30e8d814E48DaB01CBE54B5A7 -- a float, topped up; never the treasury.
      # It must hold the fee of a call plus 0.01 tBNB of gas headroom, or calls are refused (503 gateway_unfunded).
      - key: GATEWAY_KEY
        sync: false
      # GATEWAY_BEARER: what ai.gg presents (credentials.api_key of its account). Unset, the gateway refuses to start.
      - key: GATEWAY_BEARER
        sync: false
      - key: PORW_RPC
        sync: false
